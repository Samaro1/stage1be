name: Linting

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r stage1be/requirements.txt
        pip install flake8 black isort pylint

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 stage1be/main.py stage1be/models.py stage1be/utils.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 stage1be/main.py stage1be/models.py stage1be/utils.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check stage1be/main.py stage1be/models.py stage1be/utils.py || true

    - name: Check import sorting with isort
      run: |
        isort --check-only stage1be/main.py stage1be/models.py stage1be/utils.py || true
